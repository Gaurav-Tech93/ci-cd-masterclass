name: Spring_Boot_build_and_deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: sbth-app

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setting Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven


      - name: Build Jar
        run: mvn clean package -DskipTests


      - name: Building Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{env.IMAGE_NAME}}:latest .

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{env.IMAGE_NAME}}:latest .

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{env.IMAGE_NAME}}:latest
            docker stop sbth-app || true 
            docker rm sbth-app || true
            docker run -d --name sbth-app --restart unless-stopped -p 9091:9091 ${{ secrets.DOCKERHUB_USERNAME }}/${{env.IMAGE_NAME}}:latest 
            docker image prune -f

